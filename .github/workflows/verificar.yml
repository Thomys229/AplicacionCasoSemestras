name: Verificar defensa
on: [push, pull_request]
permissions:
  contents: read
jobs:
  servicios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bash gradlew -p backend test
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - run: bash gradlew :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease
